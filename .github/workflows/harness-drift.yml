name: harness-drift
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the report and issue body without opening an issue
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: harness-drift
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Detect drift
        id: drift
        run: |
          set +e
          node scripts/harness-drift.mjs --json > "$RUNNER_TEMP/drift.json"
          exit_code=$?
          set -e
          echo "changed=$exit_code" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/drift.json"
          if [ "$exit_code" -eq 1 ]; then
            # Exits 1 again on the drift it reports.
            node scripts/harness-drift.mjs --issue-body > "$RUNNER_TEMP/issue-body.md" || [ $? -eq 1 ]
            cat "$RUNNER_TEMP/issue-body.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$exit_code" -eq 0 ]; then
            echo "No drift against the reviewed baseline." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fail on fetch or parse error
        if: steps.drift.outputs.changed != '0' && steps.drift.outputs.changed != '1'
        run: |
          echo "::error::Could not fetch or parse the upstream agent registry or the harness roster."
          exit 1
      - name: Print issue body (dry run)
        if: steps.drift.outputs.changed == '1' && inputs.dry_run == true
        run: cat "$RUNNER_TEMP/issue-body.md"
      - name: Open issue
        if: steps.drift.outputs.changed == '1' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create harness-drift --color 0E8A16 --description "Upstream harness registry drift" 2>/dev/null || true
          if [ -n "$(gh issue list --label harness-drift --state open --json number --jq '.[].number')" ]; then
            echo "An open harness-drift issue already exists; skipping"
            exit 0
          fi
          gh issue create --title "chore: upstream harness registry changed" \
            --label harness-drift \
            --body-file "$RUNNER_TEMP/issue-body.md"
